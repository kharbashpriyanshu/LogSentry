[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
  | alembic
  | frontend
  | venv
  | \.venv
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "frontend",
  "alembic",
  "migrations",
  "sample_data",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "UP", "N"]
ignore = [
  "E501",   # Line length handled by formatter
  "E402",   # Module level imports after sys.path/mocking in tests
  "E711",   # Comparison to None in SQLAlchemy query filter
  "E741",   # Ambiguous variable name
  "B007",   # Loop variable not used
  "B008",   # FastAPI Depends() in function defaults is intentional
  "B904",   # Exception chaining (raise ... from)
  "S101",   # Allow assert in tests
  "S104",   # Possible binding to all interfaces (e.g. Syslog server 0.0.0.0)
  "S105",   # Possible hardcoded password in settings defaults
  "S110",   # try-except-pass
  "S603",   # Allow subprocess calls (used in test helpers)
  "UP006",  # Non-standard typing generics
  "UP007",  # Union typing | syntax
  "UP035",  # Collections typing imports
  "UP042",  # StrEnum inheritance
  "N802",   # Function name lowercase
  "N806",   # Variable in function lowercase
  "N815",   # MixedCase in Pydantic schema
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"app/models/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
"app/parsers/__init__.py" = ["F401"]
"app/detection/__init__.py" = ["F401"]
"app/detection/rules/__init__.py" = ["F401"]
"app/reports/__init__.py" = ["F401"]
"tests/**/*.py" = ["S", "E501", "F401", "F841"]
"benchmark_dataset_generator.py" = ["E501", "S311", "B007"]
"generate_large_benchmark.py" = ["E501", "S311", "B007"]
"run_full_benchmark.py" = ["E501", "E741"]
"run_large_benchmark.py" = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = ["frontend/", "migrations/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing --cov-fail-under=65"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:starlette",
  "ignore::DeprecationWarning:httpx",
]

[tool.bandit]
exclude_dirs = ["tests", "frontend", "migrations"]
skips = ["B101"]  # assert_used — allowed in tests

[tool.coverage.run]
source = ["app"]
omit = [
  "app/database/*",
  "*/migrations/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
