# =============================================================================
# LogSentry SIEM — Linux Rsyslog Remote Forwarding Configuration
# =============================================================================
# Place this file in /etc/rsyslog.d/99-logsentry.conf on any Linux server:
# (Ubuntu, Debian, RHEL, CentOS, Rocky Linux, Fedora, SUSE)
#
# Then restart rsyslog:
#   sudo systemctl restart rsyslog
# =============================================================================

# Set disk-assisted queue buffering so logs are not lost if network drops
$ActionQueueType LinkedList
$ActionQueueFileName logsentry_buffer
$ActionResumeRetryCount -1
$ActionQueueSaveOnShutdown on
$ActionQueueMaxDiskSpace 1g

# Forward auth and security logs (SSH brute force, sudo escalation, user creation)
auth,authpriv.* action(
    type="omfwd"
    target="LOGSENTRY_SIEM_IP_OR_DOMAIN"
    port="1514"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
)

# Forward web server access logs (Nginx / Apache) if forwarded to syslog facility local6/local7
local6.* action(
    type="omfwd"
    target="LOGSENTRY_SIEM_IP_OR_DOMAIN"
    port="1514"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
)

# Forward all critical system events (kernel panics, hardware errors)
*.emerg;*.alert;*.crit action(
    type="omfwd"
    target="LOGSENTRY_SIEM_IP_OR_DOMAIN"
    port="1514"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
)
