title: Suspicious PowerShell Download Cradle
id: 9b24b81c-d3f2-48a0-9753-128a38b29100
status: production
description: Detects malicious PowerShell execution attempting download cradles using WebClient or IEX.
author: LogSentry Community
date: 2026-11-21
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    command_line|contains:
      - 'DownloadString'
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
      - 'IEX('
  filter:
    user: 'SYSTEM'
  condition: selection and not filter
level: high
tags:
  - attack.t1059.001
  - attack.execution
